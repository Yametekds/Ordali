services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Demo_Passw0rd!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Ordali.Api/Dockerfile
    environment:
      ConnectionStrings__Ordali: "Server=sqlserver;Database=Ordali;User Id=sa;Password=${SA_PASSWORD:-Demo_Passw0rd!};TrustServerCertificate=True"
      # Without JWT_SIGNING_KEY the API generates a random key on each start (sessions end on restart).
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      # Demo profiles with the published password Demo1234!. Set SEED_DEMO_DATA=false outside the demo.
      Database__SeedDemoData: ${SEED_DEMO_DATA:-true}
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: "${WEB_ORIGIN:-http://localhost:8081}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Ordali.Web/Dockerfile
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "8081:80"
    depends_on:
      - api
