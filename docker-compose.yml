services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Demo_Passw0rd!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Ordali.Api/Dockerfile
    environment:
      ConnectionStrings__Ordali: "Server=sqlserver;Database=Ordali;User Id=sa;Password=${SA_PASSWORD:-Demo_Passw0rd!};TrustServerCertificate=True"
      # Demo key: set JWT_SIGNING_KEY to your own value outside the demo.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-demo-signing-key-change-me-0123456789abcdef}
      Swagger__Enabled: "true"
      Cors__AllowedOrigins__0: "${WEB_ORIGIN:-http://localhost:8081}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Ordali.Web/Dockerfile
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "8081:80"
    depends_on:
      - api
