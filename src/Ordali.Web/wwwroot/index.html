<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ordali: gestión de almacén con productos, ubicaciones, stock, movimientos y perfiles con permisos." />
    <meta name="theme-color" content="#1e1b18" />
    <title>Ordali</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Ordali.Ui/ordali.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ordali" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <span class="error-text">Ha ocurrido un error inesperado.</span>
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // The app sets the language once it starts; this covers what shows before that.
        try {
            const lang = (localStorage.getItem("ordali.language") || navigator.language || "es").slice(0, 2);
            if (lang === "en") {
                document.documentElement.lang = "en";
                document.querySelector("#blazor-error-ui .error-text").textContent = "Something went wrong.";
                document.querySelector("#blazor-error-ui .reload").textContent = "Reload";
            }
        } catch { }
    </script>
    <script src="js/install.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
