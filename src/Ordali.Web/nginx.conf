server {
    listen 80;
    root /usr/share/nginx/html;

    # Blazor ships precompressed files; serve the .gz version when the browser accepts it.
    gzip_static on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Settings and the service worker must never be cached, or a new deploy would not be picked up.
    location ~ ^/(appsettings.*\.json|service-worker\.js|service-worker-assets\.js)$ {
        add_header Cache-Control "no-cache";
    }
}
