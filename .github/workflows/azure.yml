name: Azure

# Publishes the API to Azure App Service and the web to Azure Static Web Apps.
# Each job only runs once its settings exist in the repository (see docs/azure.md),
# so forks and clones without an Azure account are not affected.
on:
  push:
    branches: [main]
    paths:
      - src/Ordali.Api/**
      - src/Ordali.Client/**
      - src/Ordali.Ui/**
      - src/Ordali.Web/**
      - deploy/azure/**
      - .github/workflows/azure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: false

jobs:
  api:
    if: vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_API_URL != ''
    runs-on: ubuntu-24.04
    environment:
      name: azure
      url: ${{ vars.AZURE_API_URL }}/swagger
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test tests/Ordali.Api.Tests -c Release
      - name: Publish
        run: dotnet publish src/Ordali.Api -c Release -o publish/api
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish/api
      - name: Wait for the API
        # The free plan and the free database both sleep when idle, so the first start is slow.
        run: >
          curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors --max-time 120
          ${{ vars.AZURE_API_URL }}/health/ready

  web:
    if: vars.AZURE_API_URL != ''
    needs: api
    runs-on: ubuntu-24.04
    environment:
      name: azure
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Point the web at the API
        run: |
          printf '{\n  "Api": {\n    "BaseUrl": "%s"\n  }\n}\n' "${{ vars.AZURE_API_URL }}" > src/Ordali.Web/wwwroot/appsettings.json
      - name: Publish
        run: |
          dotnet publish src/Ordali.Web -c Release -o publish/web
          cp deploy/azure/staticwebapp.config.json publish/web/wwwroot/
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/web/wwwroot
          skip_app_build: true
          skip_api_build: true
