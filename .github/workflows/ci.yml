name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  docker-smoke-test:
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Check the API is ready
        run: curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/health/ready
      - name: Sign in and read the catalogue
        run: |
          token=$(curl --fail -s http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.local","password":"Demo1234!"}' | jq -r .accessToken)
          curl --fail -s http://localhost:8080/api/v1/products -H "Authorization: Bearer $token" | jq -e 'length > 0'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
